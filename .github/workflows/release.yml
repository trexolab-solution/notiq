name: Release

# Trigger by pushing a version tag, e.g.  git tag v0.4.0 && git push origin v0.4.0
on:
  push:
    tags: ["v*"]

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      # Builds the app, signs the updater artifacts, creates a DRAFT GitHub release
      # with the installers + the matching latest.json (the updater endpoint).
      # Publish the draft once all platforms have uploaded — only then does the
      # `releases/latest/download/latest.json` endpoint resolve for auto-update.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The updater signing key has no password, so pass an empty string.
          # (It is not a secret, and GitHub won't store an empty-valued secret.)
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Notiq ${{ github.ref_name }}"
          releaseBody: "Download the installer for your platform below. See the commit history for changes."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

  # Packages the browser extension and attaches the three zips to the draft release that tauri-action
  # created above (browser-extension/build.mjs has no dependencies, so only Node is needed).
  extension:
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build extension packages
        run: node browser-extension/build.mjs --out dist

      # `gh release upload <tag>` resolves the tag through *published* releases, so it reports
      # "release not found" while the release is still a draft. So: find the draft's numeric id via
      # the REST list endpoint (which includes drafts for a token with contents: write), then POST
      # each file to the uploads endpoint for that id. Assets with the same name are deleted first
      # so re-running the job is safe.
      - name: Upload zips to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" --paginate --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -n 1)
          if [ -z "$RELEASE_ID" ]; then
            echo "No release (draft or published) found for tag $TAG" >&2
            exit 1
          fi
          echo "Release id: $RELEASE_ID"
          for f in dist/notiq-autofill-*.zip; do
            name=$(basename "$f")
            old=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" --paginate --jq ".[] | select(.name==\"$name\") | .id")
            for id in $old; do
              gh api --method DELETE "repos/${{ github.repository }}/releases/assets/$id"
            done
            gh api --method POST "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$name" \
              -H "Content-Type: application/zip" --input "$f" --silent
            echo "Uploaded $name"
          done
