<!doctype html>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { width: 280px; margin: 0; padding: 14px; font: 13px system-ui, sans-serif; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  h2 { font-size: 11px; margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .04em; opacity: .6; }
  p { margin: 6px 0; opacity: .8; line-height: 1.4; }
  button { width: 100%; padding: 9px; border: 0; border-radius: 8px; background: #6366f1; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #msg { min-height: 18px; }
  #msg.err { color: #ef4444; opacity: 1; }
  #msg.ok { color: #22c55e; opacity: 1; }
  hr { border: 0; border-top: 1px solid rgba(128,128,128,.25); margin: 12px 0 4px; }
  label.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 0; cursor: pointer; }
  label.row input { width: 16px; height: 16px; margin: 0; accent-color: #6366f1; flex: none; cursor: pointer; }
  details { margin-top: 6px; }
  summary { cursor: pointer; padding: 5px 0; }
  summary .count { opacity: .6; }
  ul { list-style: none; margin: 4px 0 0; padding: 0; max-height: 140px; overflow-y: auto; }
  li { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 3px 0 3px 4px; border-radius: 6px; }
  li:hover { background: rgba(128,128,128,.12); }
  li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li button { width: 22px; height: 22px; padding: 0; flex: none; background: transparent; color: inherit; opacity: .6; font-size: 15px; line-height: 1; }
  li button:hover { opacity: 1; background: rgba(239,68,68,.15); color: #ef4444; }
  .empty { opacity: .6; padding: 3px 4px; }
</style>
<h1>Notiq Autofill</h1>
<button id="fill">Fill login for this site</button>
<p id="msg"></p>
<p>Notiq will ask you to approve before anything is filled or saved. Shortcut: Alt+Shift+L.</p>
<hr>
<h2>Settings</h2>
<label class="row">Offer to save new logins <input type="checkbox" id="offerSave"></label>
<label class="row">Show Notiq icon on login fields <input type="checkbox" id="showIcon"></label>
<details id="never">
  <summary>Never save for these sites <span class="count" id="neverCount"></span></summary>
  <ul id="neverList"></ul>
</details>
<script src="popup.js"></script>
