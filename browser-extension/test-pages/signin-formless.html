<!doctype html>
<!--
  Username step with no <form> element, like Google's sign-in page: the field says
  autocomplete="username webauthn" and a hidden password field sits next to it.
  Served from localhost; the path contains "signin". The icon must show on the
  username field. ?two=1 adds a second username field: then neither gets an icon.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notiq test page: sign-in without a form</title>
<style>
  body { margin: 0; padding: 24px 16px; font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 420px; margin: 0 auto; }
  input { box-sizing: border-box; width: 100%; padding: 9px 10px; margin-bottom: 12px; font: inherit; }
</style>
</head>
<body>
<main>
  <h1>Sign in</h1>
  <div>
    <input id="g-user" name="identifier" type="text" autocomplete="username webauthn" aria-label="Email or phone">
    <input name="hiddenPassword" type="password" autocomplete="current-password" tabindex="-1" aria-hidden="true" style="display: none">
  </div>
  <div id="more"></div>
  <button type="button">Next</button>
</main>
<script>
  if (new URLSearchParams(location.search).get("two") === "1") {
    document.getElementById("more").innerHTML = '<input id="g-other" type="text" autocomplete="username">';
  }
</script>
</body>
</html>
