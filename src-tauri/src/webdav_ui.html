<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Shared files</title>
<link rel="icon" type="image/png" href="__FAVICON__">
<link rel="apple-touch-icon" href="__TOUCH_ICON__">
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #eef0f3; --text: #14171c; --muted: #657080; --line: #e1e4e9;
  --accent: #9a6b00; --accent-bg: #fbf1d8; --danger: #c0352b; --shadow: 0 1px 2px rgba(15,20,30,.06), 0 4px 14px rgba(15,20,30,.06);
  --c-folder: #d49a1a; --c-image: #2f9e6e; --c-video: #7c5cd6; --c-audio: #d1568e; --c-pdf: #d6453d; --c-text: #3b82c4; --c-archive: #8a6d3b; --c-file: #7a8696;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --panel: #171b23; --panel-2: #1f2430; --text: #e8ebf0; --muted: #8b95a5; --line: #272d3a;
    --accent: #e0b04a; --accent-bg: #2b2412; --danger: #ff7a70; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    --c-folder: #e0b04a; --c-image: #4cc790; --c-video: #a58bff; --c-audio: #f06aa4; --c-pdf: #ff6e66; --c-text: #5fa8ef; --c-archive: #c4a15f; --c-file: #8f9bb0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
    --bg: #0f1218; --panel: #171b23; --panel-2: #1f2430; --text: #e8ebf0; --muted: #8b95a5; --line: #272d3a;
    --accent: #e0b04a; --accent-bg: #2b2412; --danger: #ff7a70; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    --c-folder: #e0b04a; --c-image: #4cc790; --c-video: #a58bff; --c-audio: #f06aa4; --c-pdf: #ff6e66; --c-text: #5fa8ef; --c-archive: #c4a15f; --c-file: #8f9bb0;
}
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
svg { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
a { color: inherit; text-decoration: none; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px 40px; }
header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); padding: calc(env(safe-area-inset-top) + 12px) 0 10px; border-bottom: 1px solid var(--line); margin: 0 -16px 14px; padding-left: 16px; padding-right: 16px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; max-width: 1040px; margin: 0 auto; }
.crumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; flex: 1 1 260px; min-width: 0; font-size: 15px; }
.crumbs a, .crumbs span.cur { padding: 6px 8px; border-radius: 8px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumbs a:hover { background: var(--panel-2); }
.crumbs .cur { font-weight: 600; }
.crumbs .sep { color: var(--muted); }
.crumbs .home { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex: 1 1 280px; justify-content: flex-end; }
.search { position: relative; flex: 1 1 140px; min-width: 120px; max-width: 280px; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input { width: 100%; padding: 8px 10px 8px 32px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); outline: none; }
.search input:focus, select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
select, .btn { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 8px 10px; cursor: pointer; display: grid; place-items: center; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); }
.btn { display: inline-grid; place-items: center; }
.list { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.row { display: grid; grid-template-columns: 28px minmax(0, 1fr) 84px 168px 36px 32px; gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); cursor: pointer; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--panel-2); }
.row .ico { font-size: 22px; display: grid; place-items: center; }
.row .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .size { min-width: 70px; text-align: right; }
.dl { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; color: var(--muted); }
.dl:hover { background: var(--panel); color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); cursor: pointer; display: flex; flex-direction: column; }
.card:hover { border-color: var(--accent); }
.thumb { aspect-ratio: 4 / 3; display: grid; place-items: center; background: var(--panel-2); font-size: 44px; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .cap { padding: 9px 11px 10px; min-width: 0; }
.card .cap .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.card .cap .meta { color: var(--muted); font-size: 12px; }
.k-folder { color: var(--c-folder); } .k-image { color: var(--c-image); } .k-video { color: var(--c-video); } .k-audio { color: var(--c-audio); }
.k-pdf { color: var(--c-pdf); } .k-text { color: var(--c-text); } .k-archive { color: var(--c-archive); } .k-file { color: var(--c-file); }
.note { color: var(--muted); text-align: center; padding: 44px 12px; }
.note b { display: block; color: var(--text); font-size: 16px; margin-bottom: 4px; }
.foot { color: var(--muted); font-size: 13px; text-align: center; margin-top: 14px; }
.skeleton { height: 46px; border-top: 1px solid var(--line); background: linear-gradient(90deg, transparent, var(--panel-2), transparent); background-size: 200% 100%; animation: sk 1.3s infinite; }
@keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }
[hidden] { display: none !important; }
.btn-up { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-bg); color: var(--accent); border-color: transparent; font-weight: 600; }
.btn-up:hover { filter: brightness(1.05); }
.drop { position: fixed; inset: 0; z-index: 15; display: none; place-items: center; background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: blur(3px); }
.drop.on { display: grid; }
.drop div { border: 2px dashed var(--accent); border-radius: 18px; padding: 34px 44px; color: var(--accent); font-weight: 600; font-size: 17px; background: var(--panel); }
.ups { position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 16px); z-index: 12; width: min(360px, calc(100vw - 32px)); max-height: 50vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px 0; }
.ups-h { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px 6px; font-weight: 600; font-size: 13px; }
.ups-h button { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 2px 6px; border-radius: 6px; }
.up { padding: 7px 14px; }
.up .upn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
.up .upb { height: 4px; border-radius: 4px; background: var(--panel-2); margin: 5px 0 3px; overflow: hidden; }
.up .upb i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
.up .upm { color: var(--muted); font-size: 12px; }
.up.ok .upb i { background: var(--c-image); width: 100%; }
.up.bad .upb i { background: var(--danger); width: 100%; }
.up.bad .upm { color: var(--danger); }
.row, .card { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
.chk { display: none; width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--muted); background: var(--panel); place-items: center; color: transparent; flex: none; }
.chk svg { width: 14px; height: 14px; stroke-width: 3.2; }
.selecting .chk { display: grid; }
.sel .chk { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.list.selecting .row { grid-template-columns: 22px 28px minmax(0, 1fr) 84px 168px 36px 32px; }
.row.sel { background: var(--accent-bg); }
.card { position: relative; }
.card .chk { position: absolute; top: 9px; left: 9px; z-index: 2; }
.card.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
.selbar { display: none; align-items: center; gap: 6px; flex-wrap: wrap; max-width: 1040px; margin: 10px auto 0; padding: 6px 8px; background: var(--accent-bg); border-radius: 12px; }
.selbar.on { display: flex; }
.selbar .selc { font-weight: 600; color: var(--accent); padding: 0 6px; margin-right: auto; }
.sb { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; border: 0; border-radius: 9px; background: transparent; cursor: pointer; font-size: 14px; }
.sb:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.sb:disabled { opacity: .4; cursor: default; }
.sb.danger { color: var(--danger); }
.modal { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.5); display: grid; place-items: center; padding: 16px; }
.mbox { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; width: min(460px, 100%); max-height: min(560px, 86vh); display: flex; flex-direction: column; box-shadow: var(--shadow); overflow: hidden; }
.mh { padding: 14px 16px 4px; font-weight: 600; font-size: 16px; }
.mcrumb { padding: 0 16px 10px; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mlist { flex: 1; min-height: 120px; overflow: auto; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.mitem { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 16px; border: 0; border-top: 1px solid var(--line); background: transparent; cursor: pointer; text-align: left; }
.mitem:first-child { border-top: 0; }
.mitem:hover:not(:disabled) { background: var(--panel-2); }
.mitem:disabled { opacity: .45; cursor: default; }
.mitem svg { font-size: 20px; }
.mitem span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mempty { padding: 26px 16px; color: var(--muted); text-align: center; }
.mf { display: flex; align-items: center; gap: 8px; padding: 12px 14px; }
.mf .sp { flex: 1; }
.mhint { padding: 8px 16px 0; color: var(--danger); font-size: 12.5px; min-height: 20px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 30; background: #1b2029; color: #eef1f6; padding: 10px 16px; border-radius: 12px; box-shadow: var(--shadow); font-size: 14px; transition: .18s; max-width: calc(100vw - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { background: var(--danger); color: #fff; }
@media (max-width: 640px) {
  .list.selecting .row { grid-template-columns: 22px 26px 1fr auto 34px 34px; }
  .selbar .lbl { display: none; }
  .sb { padding: 9px 11px; }
}
.row, .card { -webkit-touch-callout: none; }
#main { min-height: 52vh; }
.lhead { display: none; grid-template-columns: 28px minmax(0, 1fr) 84px 168px 36px 32px; gap: 12px; align-items: center; padding: 8px 14px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .02em; border: 1px solid var(--line); border-bottom: 0; border-radius: 14px 14px 0 0; background: var(--panel-2); user-select: none; }
.lhead.sel { grid-template-columns: 22px 28px minmax(0, 1fr) 84px 168px 36px 32px; }
.lhead button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; padding: 2px 0; }
.lhead button:hover { color: var(--text); }
.lhead .r { justify-self: end; }
.lhead + .list { border-radius: 0 0 14px 14px; }
@media (min-width: 641px) { .lhead { display: grid; } }
.row .more, .card .more { all: unset; box-sizing: border-box; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; color: var(--muted); cursor: pointer; }
.row .more:hover, .card .more:hover { background: var(--panel); color: var(--accent); }
.card .more { position: absolute; top: 6px; right: 6px; z-index: 2; background: color-mix(in srgb, var(--panel) 80%, transparent); }
.selecting .more { display: none; }
.cut { opacity: .45; }
.dropto { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--accent-bg) !important; }
.ctx { position: fixed; z-index: 40; min-width: 210px; max-width: 280px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow), 0 12px 32px rgba(0,0,0,.18); }
.ctx button { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.ctx button:hover:not(:disabled), .ctx button:focus-visible { background: var(--accent-bg); color: var(--accent); }
.ctx button:disabled { opacity: .4; cursor: default; }
.ctx button.danger { color: var(--danger); }
.ctx button svg { color: var(--muted); }
.ctx button.danger svg { color: var(--danger); }
.ctx hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }
.ctx .k { margin-left: auto; color: var(--muted); font-size: 12px; }
.band { position: fixed; z-index: 9; pointer-events: none; border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); border-radius: 3px; }
.pr dl { margin: 0; padding: 4px 16px 10px; }
.pr .prow { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
.pr .prow:first-child { border-top: 0; }
.pr dt { color: var(--muted); }
.pr dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.pr .phead { display: flex; align-items: center; gap: 12px; padding: 4px 16px 10px; }
.pr .phead svg { font-size: 30px; }
.pr .phead b { display: block; font-size: 16px; overflow-wrap: anywhere; }
.pr .phead span { color: var(--muted); font-size: 13px; }
.viewer { position: fixed; inset: 0; z-index: 20; background: #0a0c10; display: none; flex-direction: column; color: #eef1f6; }
.viewer.on { display: flex; }
.vbar { display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 10px) 14px 10px; }
.vbar .vt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.vbar .vc { color: #9aa4b5; font-size: 13px; }
.vbtn { border: 0; background: rgba(255,255,255,.1); color: #fff; width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; cursor: pointer; font-size: 18px; }
.vbtn:hover { background: rgba(255,255,255,.2); }
.stage { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; padding: 0 12px calc(env(safe-area-inset-bottom) + 12px); }
.stage img, .stage video { max-width: 100%; max-height: 100%; border-radius: 6px; background: #000; }
.stage audio { width: min(520px, 92%); }
.stage iframe { width: 100%; height: 100%; border: 0; border-radius: 6px; background: #fff; }
.stage pre { margin: 0; width: min(960px, 100%); height: 100%; overflow: auto; background: #12161d; color: #dfe5ee; padding: 14px; border-radius: 10px; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
.stage .other { text-align: center; color: #c5ccd8; }
.stage .other .big { font-size: 64px; }
.nav { position: absolute; top: 50%; transform: translateY(-50%); }
.nav.prev { left: 10px; } .nav.next { right: 10px; }
.stage .hint { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; color: #9aa4b5; font-size: 12px; pointer-events: none; }
@media (max-width: 640px) {
  .row { grid-template-columns: 26px 1fr auto 34px 34px; gap: 10px; padding: 11px 12px; }
  .row .date { display: none; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; }
  .tools { flex-wrap: wrap; justify-content: stretch; }
  .search { flex: 1 1 100%; max-width: none; }
  .nav { display: none; }
}
@media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="bar">
      <nav class="crumbs" id="crumbs" aria-label="Folder path"></nav>
      <div class="tools">
        <button class="btn btn-up" id="up" hidden aria-label="Upload files" title="Upload files"><svg viewBox="0 0 24 24"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 20h16"/></svg><span>Upload</span></button>
        <button class="btn" id="mk" hidden aria-label="New folder" title="New folder"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM12 11v5M9.5 13.5h5"/></svg></button>
        <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search this folder" autocomplete="off" aria-label="Search this folder"></label>
        <select id="sort" aria-label="Sort by"><option value="name">Name</option><option value="size">Size</option><option value="mtime">Modified</option></select>
        <button class="btn" id="dir" aria-label="Reverse the order" title="Reverse the order"><svg viewBox="0 0 24 24"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg></button>
        <button class="btn" id="sel" aria-pressed="false" aria-label="Select files" title="Select files"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 3 3 5-6"/></svg></button>
        <button class="btn" id="theme" aria-label="Theme" title="Theme: follows the system"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /></svg></button>
        <div class="seg" role="group" aria-label="Layout">
          <button id="vlist" aria-label="List" title="List"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
          <button id="vgrid" aria-label="Grid" title="Grid"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
        </div>
      </div>
    </div>
    <div class="selbar" id="selbar" role="toolbar" aria-label="Selection">
      <span class="selc" id="selc">Select items</span>
      <button class="sb" id="sa" aria-label="Select all" title="Select all"><svg viewBox="0 0 24 24"><path d="M4 7l3 3 5-6M4 17l3 3 5-6M15 8h6M15 18h6"/></svg><span class="lbl">All</span></button>
      <button class="sb" id="sdl" aria-label="Download" title="Download"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 20h16"/></svg><span class="lbl">Download</span></button>
      <button class="sb" id="sren" hidden aria-label="Rename" title="Rename"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></svg><span class="lbl">Rename</span></button>
      <button class="sb" id="smv" hidden aria-label="Move" title="Move"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 13h7m0 0-2.5-2.5M16 13l-2.5 2.5"/></svg><span class="lbl">Move</span></button>
      <button class="sb" id="scp" hidden aria-label="Copy" title="Copy"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg><span class="lbl">Copy</span></button>
      <button class="sb danger" id="sdel" hidden aria-label="Delete" title="Delete"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg><span class="lbl">Delete</span></button>
      <button class="sb" id="sdone" aria-label="Done" title="Done (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg><span class="lbl">Done</span></button>
    </div>
  </header>
  <main id="main" aria-live="polite"></main>
  <p class="foot" id="foot"></p>
</div>

<div class="modal" id="pick" hidden role="dialog" aria-modal="true" aria-labelledby="pk-t">
  <div class="mbox">
    <div class="mh" id="pk-t">Move to…</div>
    <div class="mcrumb" id="pk-p"></div>
    <div class="mlist" id="pk-l"></div>
    <div class="mhint" id="pk-h"></div>
    <div class="mf"><button class="btn" id="pk-up">Up</button><span class="sp"></span><button class="btn" id="pk-c">Cancel</button><button class="btn btn-up" id="pk-ok">Move here</button></div>
  </div>
</div>
<div class="ctx" id="ctx" role="menu" hidden></div>
<div class="band" id="band" hidden></div>
<div class="modal" id="props" hidden role="dialog" aria-modal="true" aria-labelledby="pr-t">
  <div class="mbox pr">
    <div class="mh" id="pr-t">Properties</div>
    <div id="pr-b"></div>
    <div class="mf"><span class="sp"></span><button class="btn btn-up" id="pr-x">Close</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="drop" id="drop"><div>Drop files to upload here</div></div>
<div class="ups" id="ups" hidden><div class="ups-h"><span id="upt">Uploading</span><button id="upx" aria-label="Close">Close</button></div><div id="uplist"></div></div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Preview">
  <div class="vbar">
    <div class="vt" id="vt"></div><span class="vc" id="vc"></span>
    <a class="vbtn" id="vdl" aria-label="Download" title="Download" download><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 20h16"/></svg></a>
    <button class="vbtn" id="vx" aria-label="Close" title="Close (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="stage" id="stage">
    <button class="vbtn nav prev" id="vp" aria-label="Previous" title="Previous"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
    <button class="vbtn nav next" id="vn" aria-label="Next" title="Next"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
  </div>
</div>

<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const store = (k, d) => { try { return localStorage.getItem("notiq.share." + k) ?? d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem("notiq.share." + k, v); } catch { /* private mode */ } };

  const EXT = {
    image: "jpg jpeg png gif webp bmp svg avif ico heic",
    video: "mp4 m4v webm mov mkv ogv 3gp",
    audio: "mp3 m4a wav ogg oga flac aac opus",
    pdf: "pdf",
    text: "txt md log json csv tsv xml yml yaml toml ini conf js mjs ts tsx jsx css html htm sh bat ps1 py rs go java c h cpp cs rb php sql srt vtt env",
    archive: "zip rar 7z tar gz tgz bz2 xz iso apk",
  };
  const KIND = {};
  for (const [k, list] of Object.entries(EXT)) for (const e of list.split(" ")) KIND[e] = k;
  const PATHS = {
    folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
    text: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
    pdf: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M8.5 16.5c1.5-.5 3-2.5 3.5-5 .5 2.5 2 4 3.5 4.5"/>',
    image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.7"/><path d="m21 16-5-5-8 8"/>',
    video: '<rect x="3" y="5" width="13" height="14" rx="2"/><path d="m16 10 5-3v10l-5-3z"/>',
    audio: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
    archive: '<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10h14V9M10 13h4"/>',
  };
  const icon = (kind) => '<svg viewBox="0 0 24 24" aria-hidden="true">' + (PATHS[kind] || PATHS.file) + "</svg>";
  const kindOf = (it) => (it.dir ? "folder" : KIND[(it.name.split(".").pop() || "").toLowerCase()] || "file");
  const PREVIEW = new Set(["image", "video", "audio", "pdf", "text"]);

  const st = { path: location.pathname, items: [], sel: new Set(), selecting: false, q: "", view: store("view", "list"), sort: store("sort", "name"), desc: store("desc", "0") === "1", loading: true, error: "" };
  let shown = [], viewerList = [], vi = -1, viewerOn = false, canUpload = false, canManage = false;
  /** A mouse (or similar): click selects and double-click opens, like a desktop file manager. A touch screen taps to open. */
  const fine = typeof matchMedia === "function" && matchMedia("(pointer: fine)").matches;
  let clip = null, anchor = null;

  // An address like http://user:pass@host/ makes every relative URL carry the password, and browsers refuse such
  // fetches and subresources. So drop it from the address bar and build every URL from the bare origin.
  const O = location.origin;
  const abs = (h) => O + h;
  // pushState / replaceState throw when the address still carries a user name and password, and that must never stop a
  // feature (the viewer used to open empty): always use the bare origin, and carry on if the browser refuses anyway.
  const here = () => O + location.pathname + location.search;
  const setUrl = (kind, state, url) => { try { history[kind](state, "", url); } catch { /* the page works without a history entry */ } };
  if (location.username || location.password) setUrl("replaceState", null, here());

  const safeHref = (h) => (typeof h === "string" && h.startsWith("/") && !h.startsWith("//") ? h : "/");
  const dec = (s) => { try { return decodeURIComponent(s); } catch { return s; } };
  const size = (n) => { if (n == null) return ""; const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0, v = n; while (v >= 1024 && i < 4) { v /= 1024; i++; } return (i ? v.toFixed(v < 10 ? 1 : 0) : v) + " " + u[i]; };
  const when = (t) => (t ? new Date(t).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "");
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

  async function listDir(path) {
    const r = await fetch(abs(path), { method: "PROPFIND", headers: { Depth: "1" }, credentials: "same-origin" });
    if (r.status === 401) { location.reload(); return []; }
    if (!r.ok) throw new Error(r.status === 404 ? "This folder no longer exists." : "The server answered " + r.status + ".");
    const xml = new DOMParser().parseFromString(await r.text(), "application/xml");
    const self = dec(path).replace(/\/+$/, "");
    const items = [];
    for (const rs of xml.getElementsByTagNameNS("DAV:", "response")) {
      const g = (n) => rs.getElementsByTagNameNS("DAV:", n)[0]?.textContent ?? "";
      const href = safeHref(g("href"));
      const plain = dec(href).replace(/\/+$/, "");
      if (plain === self) continue;
      const dir = rs.getElementsByTagNameNS("DAV:", "collection").length > 0;
      const name = plain.split("/").pop() || plain;
      const len = g("getcontentlength");
      const m = Date.parse(g("getlastmodified"));
      items.push({ name, href: dir && !href.endsWith("/") ? href + "/" : href, dir, size: len === "" ? null : Number(len), mtime: Number.isNaN(m) ? 0 : m });
    }
    return items;
  }

  async function load(path, quiet = false) {
    st.path = path; st.error = "";
    if (!quiet) { st.loading = true; st.q = ""; st.selecting = false; st.sel.clear(); $("#q").value = ""; render(); }
    try { st.items = await listDir(path); } catch (e) { st.items = []; st.error = e && e.message ? e.message : "Couldn't load this folder."; }
    st.loading = false; st.sel = new Set([...st.sel].filter((h) => st.items.some((i) => i.href === h)));
    render();
  }

  function sorted() {
    const q = st.q.trim().toLowerCase();
    const k = st.sort, f = st.desc ? -1 : 1;
    return st.items.filter((i) => !q || i.name.toLowerCase().includes(q)).sort((a, b) => {
      if (a.dir !== b.dir) return a.dir ? -1 : 1;
      let c = 0;
      if (k === "size") c = (a.size ?? 0) - (b.size ?? 0);
      else if (k === "mtime") c = a.mtime - b.mtime;
      if (!c) c = a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" });
      return c * f;
    });
  }

  function crumbs() {
    const nav = $("#crumbs"); nav.replaceChildren();
    const home = el("a", "home", icon("folder") + "<span>Shared</span>"); home.href = abs("/"); home.dataset.go = "/";
    nav.append(home);
    const parts = st.path.split("/").filter(Boolean);
    let acc = "/";
    parts.forEach((p, i) => {
      acc += p + "/";
      nav.append(el("span", "sep", "/"));
      if (i === parts.length - 1) { const c = el("span", "cur"); c.textContent = dec(p); nav.append(c); }
      else { const a = el("a"); a.textContent = dec(p); a.href = abs(acc); a.dataset.go = acc; nav.append(a); }
    });
  }

  function render() {
    crumbs(); updateSelbar();
    document.title = (dec(st.path).replace(/\/+$/, "").split("/").pop() || "Shared files");
    $("#vlist").setAttribute("aria-pressed", String(st.view === "list"));
    $("#vgrid").setAttribute("aria-pressed", String(st.view === "grid"));
    $("#sort").value = st.sort;
    const main = $("#main"), foot = $("#foot"); main.replaceChildren(); foot.textContent = "";
    if (st.loading) { const box = el("div", "list"); for (let i = 0; i < 6; i++) box.append(el("div", "skeleton")); main.append(box); return; }
    if (st.error) { const n = el("div", "note", "<b>Couldn't open this folder</b>"); n.append(document.createTextNode(st.error + " ")); const b = el("button", "btn", "Try again"); b.onclick = () => load(st.path); n.append(b); main.append(n); return; }
    shown = sorted();
    if (!shown.length) { main.append(el("div", "note", st.q ? "<b>No matches</b>Nothing in this folder matches your search." : "<b>This folder is empty</b>")); return; }
    const wrap = el("div", (st.view === "grid" ? "grid" : "list") + (st.selecting ? " selecting" : ""));
    shown.forEach((it, i) => {
      const kind = kindOf(it), a = el("a", st.view === "grid" ? "card" : "row"); a.href = abs(it.href); a.dataset.i = String(i);
      const chk = el("span", "chk", CHECK); if (st.sel.has(it.href)) a.classList.add("sel");
      const name = document.createElement("div"); name.className = "name"; name.textContent = it.name; name.title = it.name;
      if (st.view === "grid") {
        const th = el("div", "thumb k-" + kind);
        if (kind === "image") { const im = document.createElement("img"); im.loading = "lazy"; im.decoding = "async"; im.alt = ""; im.src = abs(it.href); im.onerror = () => { th.innerHTML = icon(kind); }; th.append(im); } else th.innerHTML = icon(kind);
        const cap = el("div", "cap"); const meta = el("div", "meta"); meta.textContent = it.dir ? "Folder" : size(it.size);
        cap.append(name, meta); a.append(th, cap);
      } else {
        const ic = el("div", "ico k-" + kind, icon(kind)), sz = el("div", "meta size"), dt = el("div", "meta date");
        sz.textContent = it.dir ? "" : size(it.size); dt.textContent = when(it.mtime);
        a.append(ic, name, sz, dt);
        if (!it.dir) { const d = el("a", "dl", '<svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 20h16"/></svg>'); d.href = abs(it.href); d.setAttribute("download", it.name); d.setAttribute("aria-label", "Download " + it.name); d.title = "Download"; d.onclick = (e) => e.stopPropagation(); a.append(d); } else a.append(el("span"));
      }
      const more = el("button", "more", '<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>');
      more.type = "button"; more.setAttribute("aria-label", "More actions for " + it.name); more.title = "More actions";
      more.onclick = (ev) => { ev.preventDefault(); ev.stopPropagation(); if (!st.sel.has(it.href)) { st.sel.clear(); st.sel.add(it.href); } const b = more.getBoundingClientRect(); showMenu(b.left, b.bottom + 4, itemMenu()); };
      a.append(more);
      if (clip && clip.mode === "cut" && clip.items.some((x) => x.href === it.href)) a.classList.add("cut");
      if (fine && canManage) a.draggable = true;
      a.prepend(chk);
      wrap.append(a);
    });
    if (st.view !== "grid") {
      const head = el("div", "lhead" + (st.selecting ? " sel" : ""));
      if (st.selecting) head.append(el("span"));
      const col = (label, key, cls) => { const b = el("button", cls || ""); b.type = "button"; b.textContent = label + (st.sort === key ? (st.desc ? " \u2193" : " \u2191") : ""); b.onclick = () => { if (st.sort === key) st.desc = !st.desc; else { st.sort = key; st.desc = false; } save("sort", st.sort); save("desc", st.desc ? "1" : "0"); render(); }; return b; };
      head.append(el("span"), col("Name", "name"), col("Size", "size", "r"), col("Modified", "mtime"), el("span"), el("span"));
      main.append(head);
    }
    main.append(wrap);
    const dirs = shown.filter((i) => i.dir).length, files = shown.length - dirs, total = shown.reduce((s, i) => s + (i.size || 0), 0);
    foot.textContent = [dirs && dirs + (dirs === 1 ? " folder" : " folders"), files && files + (files === 1 ? " file" : " files"), files && size(total)].filter(Boolean).join(" · ");
  }

  function go(path, push = true) { if (push) setUrl("pushState", {}, abs(path)); load(path); }

  let suppress = false;
  document.addEventListener("click", (e) => {
    if (suppress) { suppress = false; e.preventDefault(); e.stopPropagation(); return; }
    const a = e.target.closest("a"); if (!a || e.defaultPrevented || e.button) return;
    if ((e.metaKey || e.ctrlKey || e.shiftKey) && !(fine && a.dataset.i != null)) return;
    if (a.dataset.go) { e.preventDefault(); if (st.selecting) setSelecting(false); go(a.dataset.go); return; }
    if (a.dataset.i != null && a.closest("#main")) {
      e.preventDefault(); const it = shown[Number(a.dataset.i)]; if (!it) return;
      if (e.target.closest(".more")) return;
      if (fine && !e.target.closest(".chk")) { pickRow(it, e); return; }
      if (st.selecting) { toggleSel(it.href); return; }
      openItem(it);
    }
  });
  document.addEventListener("dblclick", (e) => {
    if (!fine) return;
    const a = e.target.closest("#main [data-i]"); if (!a || e.target.closest(".dl, .more, .chk")) return;
    const it = shown[Number(a.dataset.i)]; if (it) openItem(it);
  });
  window.addEventListener("popstate", () => { if (viewerOn) { closeViewer(true); return; } load(location.pathname); });
  $("#q").addEventListener("input", (e) => { st.q = e.target.value; render(); });
  $("#sort").addEventListener("change", (e) => { st.sort = e.target.value; save("sort", st.sort); render(); });
  $("#dir").addEventListener("click", () => { st.desc = !st.desc; save("desc", st.desc ? "1" : "0"); render(); });
  $("#vlist").addEventListener("click", () => { st.view = "list"; save("view", "list"); render(); });
  $("#vgrid").addEventListener("click", () => { st.view = "grid"; save("view", "grid"); render(); });

  // ── selecting, and what can be done with the selection ──
  const CHECK = '<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>';
  const selItems = () => st.items.filter((i) => st.sel.has(i.href));
  function updateSelbar() {
    const on = st.selecting; $("#selbar").classList.toggle("on", on); $("#sel").setAttribute("aria-pressed", String(on));
    if (!on) return;
    const n = st.sel.size, files = selItems().filter((i) => !i.dir).length;
    $("#selc").textContent = n ? n + " selected" : "Select items";
    $("#sdl").disabled = !files; $("#sren").disabled = n !== 1; $("#smv").disabled = !n; $("#scp").disabled = !n; $("#sdel").disabled = !n;
    for (const id of ["sren", "smv", "scp", "sdel"]) $("#" + id).hidden = !canManage;
  }
  function refreshSel() {
    for (const n of document.querySelectorAll("#main [data-i]")) { const it = shown[Number(n.dataset.i)]; n.classList.toggle("sel", !!it && st.sel.has(it.href)); }
    updateSelbar();
  }
  function toggleSel(href) { if (st.sel.has(href)) st.sel.delete(href); else st.sel.add(href); refreshSel(); }
  function setSelecting(on) { st.selecting = on; if (!on) st.sel.clear(); render(); }
  function say(msg, bad = false) {
    const t = $("#toast"); t.textContent = msg; t.className = "toast on" + (bad ? " bad" : "");
    clearTimeout(say.t); say.t = setTimeout(() => t.classList.remove("on"), 3800);
  }
  const okStatus = (c) => c === 200 || c === 201 || c === 204;
  const encName = (n) => encodeURIComponent(n);
  const badName = (n) => !n || /[\\/:*?"<>|]/.test(n) || n === "." || n === ".." || /[. ]$/.test(n);
  async function dav(method, from, to) {
    try { const h = { Overwrite: "F" }; if (to) h.Destination = abs(to); return (await fetch(abs(from), { method, headers: h, credentials: "same-origin" })).status; } catch { return 0; }
  }
  async function doDownload() {
    const items = selItems();
    for (const it of items.filter((i) => !i.dir)) {
      const a = document.createElement("a"); a.href = abs(it.href); a.download = it.name; document.body.append(a); a.click(); a.remove();
      await new Promise((d) => setTimeout(d, 350));
    }
    if (items.some((i) => i.dir)) say("Folders can't be downloaded. Open one to pick its files.");
  }
  async function doRename() {
    const it = selItems()[0]; if (!it) return;
    const answer = prompt("Rename to", it.name); if (answer == null) return;
    const name = answer.trim(); if (!name || name === it.name) return;
    if (badName(name)) { say("That name isn't valid.", true); return; }
    if (st.items.some((i) => i !== it && i.name.toLowerCase() === name.toLowerCase())) { say("A file or folder with that name already exists.", true); return; }
    const c = await dav("MOVE", it.href, st.path + encName(name) + (it.dir ? "/" : ""));
    if (okStatus(c)) { say("Renamed."); st.sel.clear(); await load(st.path, true); } else say(c === 409 ? "Couldn't rename: that name is taken or not allowed." : "Couldn't rename (" + c + ").", true);
  }
  async function doDelete() {
    const items = selItems(); if (!items.length) return;
    const what = items.length === 1 ? '"' + items[0].name + '"' : items.length + " items";
    if (!confirm("Delete " + what + "?" + (items.some((i) => i.dir) ? "\nFolders are deleted with everything inside." : "") + "\nThis can't be undone.")) return;
    let ok = 0, bad = 0;
    for (const it of items) { if (okStatus(await dav("DELETE", it.href))) ok++; else bad++; }
    st.sel.clear(); say(bad ? ok + " deleted, " + bad + " failed." : ok === 1 ? "Deleted." : ok + " items deleted.", !!bad);
    await load(st.path, true);
  }
  // Move / copy: pick the destination folder in a small dialog.
  const pk = { mode: "move", path: "/", items: [] };
  const closePicker = () => { $("#pick").hidden = true; };
  async function pickLoad(path) {
    pk.path = path; $("#pk-p").textContent = dec(path); $("#pk-l").replaceChildren(el("div", "mempty", "Loading…"));
    try { pk.items = (await listDir(path)).filter((i) => i.dir); } catch { pk.items = []; }
    const list = $("#pk-l"); list.replaceChildren();
    const moving = selItems().filter((i) => i.dir).map((i) => i.href);
    if (!pk.items.length) list.append(el("div", "mempty", "No folders here. You can still use this one."));
    for (const f of pk.items) {
      const b = el("button", "mitem k-folder", icon("folder") + "<span></span>"); b.lastChild.textContent = f.name; b.lastChild.style.color = "var(--text)";
      b.disabled = pk.mode === "move" && moving.includes(f.href); b.onclick = () => pickLoad(f.href); list.append(b);
    }
    const inside = moving.some((h) => path.startsWith(h)), same = pk.mode === "move" && path === st.path;
    $("#pk-ok").disabled = inside || same;
    $("#pk-h").textContent = inside ? "A folder can't go inside itself." : same ? "These items are already in this folder." : "";
  }
  function openPicker(mode) {
    if (!st.sel.size) return;
    pk.mode = mode; $("#pk-t").textContent = mode === "move" ? "Move to…" : "Copy to…"; $("#pk-ok").textContent = mode === "move" ? "Move here" : "Copy here";
    $("#pick").hidden = false; void pickLoad(st.path);
  }
  async function pickConfirm() {
    const items = selItems(), dest = pk.path, method = pk.mode === "move" ? "MOVE" : "COPY";
    closePicker();
    const taken = new Set((await listDir(dest).catch(() => [])).map((i) => i.name));
    let ok = 0, bad = 0;
    for (const it of items) {
      const name = uniqueName(it.name, taken); taken.add(name);
      if (okStatus(await dav(method, it.href, dest + encName(name) + (it.dir ? "/" : "")))) ok++; else bad++;
    }
    st.sel.clear(); const verb = method === "MOVE" ? "moved" : "copied";
    say(bad ? ok + " " + verb + ", " + bad + " failed." : ok === 1 ? "1 item " + verb + "." : ok + " items " + verb + ".", !!bad);
    await load(st.path, true);
  }
  $("#sel").addEventListener("click", () => setSelecting(!st.selecting));
  $("#sdone").addEventListener("click", () => setSelecting(false));
  $("#sa").addEventListener("click", () => { if (st.sel.size === shown.length) st.sel.clear(); else for (const i of shown) st.sel.add(i.href); refreshSel(); });
  $("#sdl").addEventListener("click", () => void doDownload());
  $("#sren").addEventListener("click", () => void doRename());
  $("#sdel").addEventListener("click", () => void doDelete());
  $("#smv").addEventListener("click", () => openPicker("move"));
  $("#scp").addEventListener("click", () => openPicker("copy"));
  $("#pk-c").addEventListener("click", closePicker);
  $("#pk-ok").addEventListener("click", () => void pickConfirm());
  $("#pk-up").addEventListener("click", () => { const parts = pk.path.split("/").filter(Boolean); parts.pop(); void pickLoad("/" + parts.join("/") + (parts.length ? "/" : "")); });
  $("#pick").addEventListener("click", (e) => { if (e.target === $("#pick")) closePicker(); });
  // Touch: press and hold an item to start selecting.
  let lp = 0; const main = $("#main");
  main.addEventListener("pointerdown", (e) => {
    suppress = false; if (e.pointerType === "mouse") return;
    const a = e.target.closest("[data-i]"); if (!a || e.target.closest(".dl")) return;
    clearTimeout(lp);

    x.onload = () => done(x.status); x.onerror = () => done(0); x.send(file);
  });
  function upRow(name) {
    const row = el("div", "up"), n = el("div", "upn"), bar = el("div", "upb", "<i></i>"), m = el("div", "upm");
    n.textContent = name; n.title = name; m.textContent = "Waiting…"; row.append(n, bar, m); $("#uplist").append(row);
    return {
      set: (p) => { bar.firstChild.style.width = Math.round(p * 100) + "%"; m.textContent = Math.round(p * 100) + "%"; },
      done: (msg) => { row.classList.add("ok"); m.textContent = msg; },
      fail: (msg) => { row.classList.add("bad"); m.textContent = msg; },
    };
  }
  async function uploadFiles(list, forceDir) {
    const files = [...list].filter((f) => f && f.name);
    if (!canUpload || !files.length || uploading) return;
    uploading = true; $("#uplist").replaceChildren(); $("#ups").hidden = false; $("#upt").textContent = "Uploading " + files.length + (files.length === 1 ? " file" : " files");
    const dir = forceDir || st.path, taken = new Set(st.items.map((i) => i.name));
    let ok = 0, failed = 0;
    for (const f of files) {
      const row = upRow(f.__rel || f.name); let name = f.__rel ? f.__rel : uniqueName(f.name, taken), status = 0;
      for (let tries = 0; tries < (f.__rel ? 1 : 5); tries++) {
        status = await put(abs(dir + name.split("/").map(encodeURIComponent).join("/")), f, row.set);
        if (status !== 409 || f.__rel) break;
        taken.add(name); name = uniqueName(f.name, taken);
      }
      if (!f.__rel) taken.add(name);
      if (status === 200 || status === 201 || status === 204) { ok++; row.done(!f.__rel && name !== f.name ? "Saved as " + name : "Uploaded"); }
      else { failed++; row.fail(status === 0 ? "Connection lost" : status === 409 ? "Couldn't save this file" : "Failed (" + status + ")"); }
    }
    uploading = false; $("#upt").textContent = failed ? ok + " uploaded, " + failed + " failed" : "Uploaded " + ok + (ok === 1 ? " file" : " files");
    if (st.path === dir) await load(dir, true);
    if (!failed) setTimeout(() => { if (!uploading) $("#ups").hidden = true; }, 3500);
  }
  // Dropped folders: make the folders, then upload every file into its place (the top folder gets a free name).
  async function walk(entry, rel, out) {
    if (entry.isFile) { out.files.push({ file: await new Promise((ok, no) => entry.file(ok, no)), rel }); return; }
    out.dirs.push(rel);
    const reader = entry.createReader();
    for (;;) {
      const batch = await new Promise((ok, no) => reader.readEntries(ok, no));
      if (!batch.length) break;
      for (const c of batch) await walk(c, rel + "/" + c.name, out);
    }
  }
  async function uploadEntries(entries) {
    if (!canUpload || uploading) return; uploading = true;
    const dirBase = st.path, taken = new Set(st.items.map((i) => i.name)), out = { files: [], dirs: [] };
    try {
      for (const en of entries.filter(Boolean)) { const top = uniqueName(en.name, taken); taken.add(top); await walk(en, top, out); }
    } catch { uploading = false; say("Couldn't read the dropped folder.", true); return; }
    uploading = false;
    for (const d of out.dirs) await fetch(abs(dirBase + d.split("/").map(encodeURIComponent).join("/") + "/"), { method: "MKCOL", credentials: "same-origin" }).catch(() => {});
    await uploadFiles(out.files.map((x) => Object.assign(x.file, { __rel: x.rel })), dirBase);
  }
  $("#up").addEventListener("click", () => $("#file").click());
  $("#file").addEventListener("change", (e) => { void uploadFiles(e.target.files); e.target.value = ""; });
  $("#upx").addEventListener("click", () => { $("#ups").hidden = true; });
  $("#mk").addEventListener("click", async () => {
    const name = (prompt("New folder name") || "").trim();
    if (!name) return;
    if (/[\\/:*?"<>|]/.test(name) || name === "." || name === "..") { alert("That name isn't valid."); return; }
    const r = await fetch(abs(st.path + encodeURIComponent(name) + "/"), { method: "MKCOL", credentials: "same-origin" });
    if (r.status === 201) await load(st.path, true); else alert(r.status === 409 ? "A file or folder with that name already exists." : "Couldn't create the folder.");
  });
  let dragDepth = 0;
  const hasFiles = (e) => canUpload && !viewerOn && e.dataTransfer && [...e.dataTransfer.types].includes("Files");
  window.addEventListener("dragenter", (e) => { if (hasFiles(e)) { dragDepth++; $("#drop").classList.add("on"); } });
  window.addEventListener("dragleave", (e) => { if (hasFiles(e) && --dragDepth <= 0) { dragDepth = 0; $("#drop").classList.remove("on"); } });
  window.addEventListener("dragover", (e) => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener("drop", (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault(); dragDepth = 0; $("#drop").classList.remove("on");
    const entries = [...e.dataTransfer.items].filter((i) => i.kind === "file").map((i) => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null));
    if (entries.some((x) => x && x.isDirectory)) { void uploadEntries(entries); return; }
    void uploadFiles([...e.dataTransfer.files]);
  });

  void detect();
  load(location.pathname);
})();
</script>
</body>
</html>
