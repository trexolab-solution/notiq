<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Notiq WebDAV</title>
<link rel="icon" type="image/png" href="__FAVICON__">
<link rel="apple-touch-icon" href="__TOUCH_ICON__">
<style>
:root {
  color-scheme: light dark;
  --bg: #f3f4f7; --panel: #ffffff; --panel-2: #f0f2f6; --panel-3: #e8ebf1; --text: #151922; --muted: #667085; --line: #e2e5ec;
  --accent: #9b6700; --accent-bg: #fcf1d6; --accent-ink: #ffffff; --danger: #c4352b; --ok: #1f9d6a;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 6px 18px rgba(16,24,40,.07); --pop: 0 10px 34px rgba(16,24,40,.18), 0 2px 6px rgba(16,24,40,.08);
  --c-folder: #d9971b; --c-image: #1f9d6a; --c-video: #7a5af0; --c-audio: #d6478a; --c-pdf: #d6453d; --c-text: #3b82c4; --c-archive: #92703a; --c-file: #758195;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1015; --panel: #151922; --panel-2: #1b212b; --panel-3: #232a36; --text: #e8ecf3; --muted: #8b96a8; --line: #252c38;
    --accent: #e4b351; --accent-bg: #2a2312; --accent-ink: #1b1405; --danger: #ff7b70; --ok: #4cc790;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.34); --pop: 0 12px 38px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
    --c-folder: #e4b351; --c-image: #4cc790; --c-video: #a58bff; --c-audio: #f06aa4; --c-pdf: #ff6e66; --c-text: #5fa8ef; --c-archive: #c4a15f; --c-file: #8f9bb0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d1015; --panel: #151922; --panel-2: #1b212b; --panel-3: #232a36; --text: #e8ecf3; --muted: #8b96a8; --line: #252c38;
  --accent: #e4b351; --accent-bg: #2a2312; --accent-ink: #1b1405; --danger: #ff7b70; --ok: #4cc790;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.34); --pop: 0 12px 38px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
  --c-folder: #e4b351; --c-image: #4cc790; --c-video: #a58bff; --c-audio: #f06aa4; --c-pdf: #ff6e66; --c-text: #5fa8ef; --c-archive: #c4a15f; --c-file: #8f9bb0;
}
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
svg { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ── shell ── */
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.top { display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 10px) 14px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
.menu-b { display: none !important; }
.brand { display: flex; align-items: center; gap: 10px; padding-right: 8px; margin-right: 2px; border-right: 1px solid var(--line); }
.brand .logo { width: 30px; height: 30px; border-radius: 8px; display: block; }
.brand span { display: flex; flex-direction: column; line-height: 1.12; padding-right: 8px; }
.brand b { font-size: 15px; letter-spacing: -.01em; }
.brand small { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.nav { display: flex; gap: 2px; }
.ib { all: unset; box-sizing: border-box; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; color: var(--muted); cursor: pointer; font-size: 17px; }
.ib:hover:not(:disabled) { background: var(--panel-2); color: var(--text); }
.ib:disabled { opacity: .35; cursor: default; }
.ib[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); }
.crumbs { display: flex; align-items: center; gap: 1px; flex: 1; min-width: 0; padding: 4px 6px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel-2); overflow: hidden; }
.crumbs a, .crumbs .cur { padding: 4px 8px; border-radius: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
.crumbs a:hover { background: var(--panel-3); }
.crumbs .cur { font-weight: 600; }
.crumbs .sep { color: var(--muted); opacity: .6; }
.crumbs .home { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.search { position: relative; width: 240px; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input { width: 100%; height: 36px; padding: 0 12px 0 33px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel-2); outline: none; }
.search input:focus { border-color: var(--accent); background: var(--panel); }

.cmd { display: flex; align-items: center; gap: 4px; padding: 7px 14px; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.cmd::-webkit-scrollbar { display: none; }
.cb { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 11px; border-radius: 10px; cursor: pointer; white-space: nowrap; font-size: 13.5px; color: var(--text); }
.cb svg { font-size: 16px; color: var(--muted); }
.cb:hover:not(:disabled) { background: var(--panel-2); }
.cb:hover:not(:disabled) svg { color: var(--accent); }
.cb:disabled { opacity: .38; cursor: default; }
.cb.pri { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.cb.pri svg { color: inherit; }
.cb.pri:hover:not(:disabled) { background: var(--accent); filter: brightness(1.07); }
.cb.danger:hover:not(:disabled), .cb.danger:hover:not(:disabled) svg { color: var(--danger); }
.vsep { width: 1px; height: 20px; background: var(--line); margin: 0 5px; flex: none; }
.grow { flex: 1; min-width: 8px; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 4px 0 10px; border-radius: 999px; background: var(--accent-bg); color: var(--accent); font-weight: 600; font-size: 12.5px; }
.chip button { all: unset; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; cursor: pointer; }
.chip button:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.sortsel { height: 34px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.seg button { all: unset; display: grid; place-items: center; width: 34px; height: 32px; color: var(--muted); cursor: pointer; font-size: 16px; }
.seg button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); }

.cols { flex: 1; display: flex; min-height: 0; }
.side { width: 252px; flex: none; overflow: auto; padding: 10px 8px 16px; background: var(--panel); border-right: 1px solid var(--line); }
.side h6 { margin: 8px 10px 6px; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.tn { display: flex; align-items: center; gap: 5px; height: 32px; padding-right: 8px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
.tn:hover { background: var(--panel-2); }
.tn.cur { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.tn .tw { all: unset; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; color: var(--muted); cursor: pointer; font-size: 12px; transition: transform .12s; }
.tn .tw.open { transform: rotate(90deg); }
.tn .tw:hover { background: var(--panel-3); }
.tn .tw.none { visibility: hidden; }
.tn svg.fi { font-size: 16px; color: var(--c-folder); }
.tn .tl { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.main { flex: 1; min-width: 0; overflow: auto; position: relative; padding: 14px 16px 18px; }
#main { min-height: calc(100% - 4px); }
.status { display: flex; align-items: center; gap: 14px; padding: 7px 14px calc(env(safe-area-inset-bottom) + 7px); background: var(--panel); border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }
.status .mode { display: inline-flex; align-items: center; gap: 6px; }
.status .mode i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.scrim { display: none; }

/* ── lists and grids ── */
.lhead, .row { display: grid; grid-template-columns: var(--c1, 22px) 34px minmax(0, 1fr) 150px 112px 88px 32px; gap: 10px; align-items: center; }
.lhead { padding: 8px 12px; color: var(--muted); font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; border: 1px solid var(--line); border-bottom: 0; border-radius: var(--r) var(--r) 0 0; background: var(--panel-2); user-select: none; }
.lhead button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; padding: 2px 0; }
.lhead button:hover { color: var(--text); }
.lhead .r { justify-self: end; }
.list { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.lhead + .list { border-radius: 0 0 var(--r) var(--r); box-shadow: none; }
.row { padding: 6px 12px; min-height: 46px; border-top: 1px solid var(--line); cursor: default; user-select: none; -webkit-touch-callout: none; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--panel-2); }
.row.sel { background: var(--accent-bg); }
.row .ico { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; font-size: 18px; background: color-mix(in srgb, currentColor 13%, transparent); }
.row .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.row .meta { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.row .size { text-align: right; }
.chk { visibility: hidden; display: grid; width: 20px; height: 20px; border-radius: 6px; border: 1.8px solid var(--muted); background: var(--panel); place-items: center; color: transparent; flex: none; }
.chk svg { width: 13px; height: 13px; stroke-width: 3.2; }
.row:hover .chk, .card:hover .chk, .selecting .chk { visibility: visible; }
.sel .chk { visibility: visible; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.more { all: unset; box-sizing: border-box; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; color: var(--muted); cursor: pointer; opacity: 0; }
.row:hover .more, .card:hover .more, .row.sel .more, .more:focus-visible { opacity: 1; }
.more:hover { background: var(--panel-3); color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px; }
.card { position: relative; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); cursor: default; user-select: none; -webkit-touch-callout: none; transition: border-color .12s, transform .12s; }
.card:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.card.sel { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--accent-bg); }
.thumb { aspect-ratio: 4 / 3; display: grid; place-items: center; font-size: 46px; overflow: hidden; background: color-mix(in srgb, currentColor 9%, var(--panel-2)); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .cap { padding: 10px 12px 11px; min-width: 0; }
.card .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; font-size: 13.5px; }
.card .meta { color: var(--muted); font-size: 12px; }
.card .chk { position: absolute; top: 9px; left: 9px; z-index: 2; background: color-mix(in srgb, var(--panel) 88%, transparent); }
.card .more { position: absolute; top: 6px; right: 6px; z-index: 2; background: color-mix(in srgb, var(--panel) 88%, transparent); }
.k-folder { color: var(--c-folder); } .k-image { color: var(--c-image); } .k-video { color: var(--c-video); } .k-audio { color: var(--c-audio); }
.k-pdf { color: var(--c-pdf); } .k-text { color: var(--c-text); } .k-archive { color: var(--c-archive); } .k-file { color: var(--c-file); }
.cut, .dragging { opacity: .45; }
.dragghost { position: fixed; top: -200px; left: -200px; padding: 8px 14px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 13.5px; box-shadow: var(--pop); }
.dropto { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--accent-bg) !important; }
.note { display: grid; place-items: center; gap: 4px; text-align: center; color: var(--muted); padding: 70px 16px; }
.note svg { font-size: 54px; color: var(--c-folder); opacity: .55; margin-bottom: 6px; }
.note b { display: block; color: var(--text); font-size: 17px; }
.foot { color: var(--muted); }
.skeleton { height: 46px; border-top: 1px solid var(--line); background: linear-gradient(90deg, transparent, var(--panel-2), transparent); background-size: 200% 100%; animation: sk 1.3s infinite; }
@keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.band { position: fixed; z-index: 9; pointer-events: none; border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); border-radius: 3px; }

/* ── menus, dialogs, toasts ── */
.ctx { position: fixed; z-index: 40; min-width: 220px; max-width: 290px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 13px; box-shadow: var(--pop); }
.ctx button { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 11px; width: 100%; padding: 8px 10px; border-radius: 9px; cursor: pointer; font-size: 14px; }
.ctx button:hover:not(:disabled), .ctx button:focus-visible { background: var(--accent-bg); color: var(--accent); }
.ctx button:disabled { opacity: .4; cursor: default; }
.ctx button.danger { color: var(--danger); }
.ctx button svg { color: var(--muted); font-size: 16px; }
.ctx button.danger svg { color: var(--danger); }
.ctx hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }
.ctx .k { margin-left: auto; color: var(--muted); font-size: 12px; }
.modal { position: fixed; inset: 0; z-index: 25; background: rgba(8,10,14,.52); backdrop-filter: blur(2px); display: grid; place-items: center; padding: 16px; }
.mbox { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; width: min(480px, 100%); max-height: min(580px, 88vh); display: flex; flex-direction: column; box-shadow: var(--pop); overflow: hidden; }
.mh { padding: 16px 18px 4px; font-weight: 700; font-size: 16.5px; }
.mcrumb { padding: 0 18px 12px; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mlist { flex: 1; min-height: 120px; overflow: auto; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.mitem { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 11px; width: 100%; padding: 11px 18px; border-top: 1px solid var(--line); cursor: pointer; }
.mitem:first-child { border-top: 0; }
.mitem:hover:not(:disabled) { background: var(--panel-2); }
.mitem:disabled { opacity: .45; cursor: default; }
.mitem svg { font-size: 20px; }
.mitem span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mempty { padding: 28px 18px; color: var(--muted); text-align: center; }
.mf { display: flex; align-items: center; gap: 8px; padding: 13px 16px; }
.mf .sp { flex: 1; }
.mhint { padding: 8px 18px 0; color: var(--danger); font-size: 12.5px; min-height: 20px; }
.btn { height: 34px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.btn:hover:not(:disabled) { background: var(--panel-2); }
.btn:disabled { opacity: .45; cursor: default; }
.dlg-m { margin: 0; padding: 2px 18px 14px; line-height: 1.5; }
.dlg-b { padding: 2px 18px 4px; }
.dlg-i { width: 100%; height: 40px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel-2); outline: none; }
.dlg-i:focus { border-color: var(--accent); background: var(--panel); }
.dlg-i[aria-invalid="true"] { border-color: var(--danger); }
.dlg-e { min-height: 20px; margin-top: 6px; color: var(--danger); font-size: 12.5px; }
.btn-up.danger { background: var(--danger); color: #fff; }
.btn-up { background: var(--accent); border-color: transparent; color: var(--accent-ink); font-weight: 600; }
.btn-up:hover:not(:disabled) { background: var(--accent); filter: brightness(1.07); }
.pr dl { margin: 0; padding: 4px 18px 10px; }
.pr .prow { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.pr .prow:first-child { border-top: 0; }
.pr dt { color: var(--muted); }
.pr dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.pr .phead { display: flex; align-items: center; gap: 13px; padding: 6px 18px 12px; }
.pr .phead > span { font-size: 28px; display: grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: color-mix(in srgb, currentColor 13%, transparent); }
.pr .phead b { display: block; font-size: 16px; overflow-wrap: anywhere; }
.pr .phead div > span { color: var(--muted); font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 52px); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 30; background: #1b2029; color: #eef1f6; padding: 10px 16px; border-radius: 12px; box-shadow: var(--pop); font-size: 14px; max-width: calc(100vw - 32px); transition: .18s; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { background: var(--danger); color: #fff; }
.drop { position: fixed; inset: 0; z-index: 15; display: none; place-items: end center; padding-bottom: 76px; pointer-events: none; background: color-mix(in srgb, var(--accent) 7%, transparent); box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--accent) 55%, transparent); }
.drop.on { display: grid; }
.drop div { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 14px; color: var(--accent-ink); background: var(--accent); font-weight: 700; font-size: 14.5px; box-shadow: var(--pop); }
.ups { position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 46px); z-index: 12; width: min(388px, calc(100vw - 24px)); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--pop); overflow: hidden; }
.ups-h { display: flex; align-items: center; gap: 4px; padding: 10px 8px 8px 16px; }
.ups-t { flex: 1; min-width: 0; }
.ups-t b { display: block; font-size: 14.5px; }
.ups-t span { display: block; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.ups-bar { height: 3px; background: var(--panel-3); }
.ups-bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.ups.done .ups-bar i { background: var(--ok); }
.ups.bad .ups-bar i { background: var(--danger); }
.ups.col #uplist { display: none; }
#uplist { max-height: 292px; overflow: auto; }
#upc svg { transition: transform .15s; }
.ups.col #upc svg { transform: rotate(180deg); }
.up { display: flex; align-items: center; gap: 12px; padding: 9px 12px 9px 16px; border-top: 1px solid var(--line); }
.up .ui { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; font-size: 17px; background: color-mix(in srgb, currentColor 13%, transparent); flex: none; }
.up .ut { flex: 1; min-width: 0; }
.up .upn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; font-weight: 500; }
.up .upm { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.up.bad .upm { color: var(--danger); }
.up.off { opacity: .6; }
.up .ua { all: unset; box-sizing: border-box; position: relative; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; color: var(--muted); cursor: pointer; flex: none; font-size: 15px; }
.up .ua:hover { background: var(--panel-2); color: var(--text); }
.up .ua.okc { color: var(--ok); cursor: default; }
.up .ua.okc:hover { background: transparent; }
.up .ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.up .ring circle { fill: none; stroke-width: 2.6; }
.up .ring .bg { stroke: var(--panel-3); }
.up .ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .15s; }

/* ── viewer ── */
.viewer { position: fixed; inset: 0; z-index: 20; background: #0a0c10; display: none; flex-direction: column; color: #eef1f6; }
.viewer.on { display: flex; }
.vbar { display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 10px) 14px 10px; }
.vbar .vt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.vbar .vc { color: #9aa4b5; font-size: 13px; }
.vbtn { border: 0; background: rgba(255,255,255,.1); color: #fff; width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; cursor: pointer; font-size: 18px; }
.vbtn:hover { background: rgba(255,255,255,.2); }
.stage { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; padding: 0 12px calc(env(safe-area-inset-bottom) + 12px); }
.stage img, .stage video { max-width: 100%; max-height: 100%; border-radius: 8px; background: #000; }
.stage audio { width: min(520px, 92%); }
.stage iframe { width: 100%; height: 100%; border: 0; border-radius: 8px; background: #fff; }
.stage pre { margin: 0; width: min(960px, 100%); height: 100%; overflow: auto; background: #12161d; color: #dfe5ee; padding: 14px; border-radius: 12px; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
.nav2 { position: absolute; top: 50%; transform: translateY(-50%); }
.stage .nav.prev, .stage .nav.next { position: absolute; top: 50%; transform: translateY(-50%); }
.stage .nav.prev { left: 10px; } .stage .nav.next { right: 10px; }
.stage .hint { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; color: #9aa4b5; font-size: 12px; pointer-events: none; }

/* ── responsive ── */
@media (max-width: 1240px) { .cb:not(.pri) span { display: none; } .cb { padding: 0 9px; } }
@media (max-width: 1100px) { .lhead, .row { grid-template-columns: var(--c1, 22px) 34px minmax(0, 1fr) 140px 88px 32px; } .lhead > :nth-child(5), .row .type { display: none; } }
@media (max-width: 900px) {
  .side { position: fixed; z-index: 22; top: 0; bottom: 0; left: 0; width: min(290px, 84vw); transform: translateX(-102%); transition: transform .18s; box-shadow: var(--pop); padding-top: calc(env(safe-area-inset-top) + 12px); }
  body.nav-open .side { transform: none; }
  body.nav-open .scrim { display: block; position: fixed; inset: 0; z-index: 21; background: rgba(8,10,14,.45); }
  .menu-b { display: inline-grid !important; }
  .search { width: 150px; }
  .brand span { display: none; }
}
@media (max-width: 700px) {
  .top { flex-wrap: wrap; gap: 8px; padding-left: 10px; padding-right: 10px; }
  .crumbs { order: 3; flex: 1 1 100%; }
  .search { flex: 1; width: auto; }
  .nav .ib.hide-m { display: none; }
  .cb span { display: none; } .cb { padding: 0 9px; }
  .lhead { display: none; }
  .lhead, .row { grid-template-columns: var(--c1, 22px) 34px minmax(0, 1fr) 80px 32px; gap: 9px; }
  .row .date { display: none; }
  .main { padding: 10px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .more { opacity: 1; }
  .status .hide-m { display: none; }
}
@media (pointer: coarse) {
  .list:not(.selecting), .lhead:not(.sel) { --c1: 0px; }
  .list:not(.selecting) .chk { width: 0; height: 0; border: 0; }
  #sel { display: inline-grid; }
}
@media (pointer: fine) { #sel { display: none; } }
@media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="ib menu-b" id="menu" aria-label="Folders" title="Folders"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="brand"><img class="logo" src="__TOUCH_ICON__" alt="" width="30" height="30"><span><b>Notiq</b><small>WebDAV</small></span></div>

    <button class="ib" id="theme" aria-label="Theme" title="Theme: follows the system"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/></svg></button>
  </header>
  <div class="cmd selbar" id="selbar" role="toolbar" aria-label="Actions">

    <button class="cb" id="mk" hidden aria-label="New folder" title="New folder"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM12 11v5M9.5 13.5h5"/></svg><span>New folder</span></button>
    <button class="cb" id="nf" hidden aria-label="New file" title="New file"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M12 12v5M9.5 14.5h5"/></svg><span>New file</span></button>
    <i class="vsep" id="sepm" hidden></i>
    <button class="cb" id="scut" hidden aria-label="Cut" title="Cut (Ctrl+X)"><svg viewBox="0 0 24 24"><path d="M6 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg><span>Cut</span></button>
    <button class="cb" id="sccopy" hidden aria-label="Copy" title="Copy (Ctrl+C)"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg><span>Copy</span></button>
    <button class="cb" id="spaste" hidden aria-label="Paste" title="Paste (Ctrl+V)"><svg viewBox="0 0 24 24"><path d="M9 4h6v3H9zM8 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/></svg><span>Paste</span></button>
    <button class="cb" id="sren" hidden aria-label="Rename" title="Rename (F2)"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></svg><span>Rename</span></button>
    <button class="cb danger" id="sdel" hidden aria-label="Delete" title="Delete (Del)"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg><span>Delete</span></button>
    <i class="vsep"></i>
    <button class="cb" id="sdl" aria-label="Download" title="Download"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 20h16"/></svg><span>Download</span></button>
    <span class="chip" id="chip" hidden><span id="selc"></span><button id="sdone" aria-label="Clear selection" title="Clear selection (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></span>
    <span class="grow"></span>
    <button class="cb" id="sa" aria-label="Select all" title="Select all (Ctrl+A)"><svg viewBox="0 0 24 24"><path d="M4 7l3 3 5-6M4 17l3 3 5-6M15 8h6M15 18h6"/></svg><span>Select all</span></button>
    <button class="ib" id="sel" aria-pressed="false" aria-label="Select files" title="Select files"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 3 3 5-6"/></svg></button>
    <select class="sortsel" id="sort" aria-label="Sort by"><option value="name">Name</option><option value="size">Size</option><option value="mtime">Modified</option></select>
    <button class="ib" id="dir" aria-label="Reverse the order" title="Reverse the order"><svg viewBox="0 0 24 24"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg></button>
    <div class="seg" role="group" aria-label="Layout">
      <button id="vlist" aria-label="List" title="List"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
      <button id="vgrid" aria-label="Grid" title="Grid"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
    </div>
  </div>
  <div class="cols">
    <aside class="side" id="side" aria-label="Folders"><h6>Folders</h6><div id="tree" role="tree"></div></aside>
    <div class="scrim" id="scrim"></div>

  </div>
  <footer class="status"><span id="foot"></span><span class="grow"></span><span class="mode hide-m" id="mode"><i></i><span>Connected</span></span><span class="hide-m">· Notiq</span></footer>

<div class="modal" id="pick" hidden role="dialog" aria-modal="true" aria-labelledby="pk-t">

    <div class="mh" id="pk-t">Move to…</div>
    <div class="mcrumb" id="pk-p"></div>

<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const store = (k, d) => { try { return localStorage.getItem("notiq.share." + k) ?? d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem("notiq.share." + k, v); } catch { /* private mode */ } };

  const EXT = {
    image: "jpg jpeg png gif webp bmp svg avif ico heic",
    video: "mp4 m4v webm mov mkv ogv 3gp",
    audio: "mp3 m4a wav ogg oga flac aac opus",
    pdf: "pdf",
    text: "txt md log json csv tsv xml yml yaml toml ini conf js mjs ts tsx jsx css html htm sh bat ps1 py rs go java c h cpp cs rb php sql srt vtt env",
    archive: "zip rar 7z tar gz tgz bz2 xz iso apk",
  };
  const KIND = {};
  for (const [k, list] of Object.entries(EXT)) for (const e of list.split(" ")) KIND[e] = k;
  const PATHS = {
    folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
    text: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
    pdf: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M8.5 16.5c1.5-.5 3-2.5 3.5-5 .5 2.5 2 4 3.5 4.5"/>',
    image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.7"/><path d="m21 16-5-5-8 8"/>',
    video: '<rect x="3" y="5" width="13" height="14" rx="2"/><path d="m16 10 5-3v10l-5-3z"/>',
    audio: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
    archive: '<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10h14V9M10 13h4"/>',
  };
  const icon = (kind) => '<svg viewBox="0 0 24 24" aria-hidden="true">' + (PATHS[kind] || PATHS.file) + "</svg>";
  const kindOf = (it) => (it.dir ? "folder" : KIND[(it.name.split(".").pop() || "").toLowerCase()] || "file");
  const PREVIEW = new Set(["image", "video", "audio", "pdf", "text"]);

  const st = { path: location.pathname, items: [], sel: new Set(), selecting: false, q: "", view: store("view", "list"), sort: store("sort", "name"), desc: store("desc", "0") === "1", loading: true, error: "" };
  let shown = [], viewerList = [], vi = -1, viewerOn = false, canUpload = false, canManage = false;
  /** A mouse (or similar): click selects and double-click opens, like a desktop file manager. A touch screen taps to open. */
  const fine = typeof matchMedia === "function" && matchMedia("(pointer: fine)").matches;
  let clip = null, anchor = null;

  // An address like http://user:pass@host/ makes every relative URL carry the password, and browsers refuse such
  // fetches and subresources. So drop it from the address bar and build every URL from the bare origin.
  const O = location.origin;
  const abs = (h) => O + h;
  // pushState / replaceState throw when the address still carries a user name and password, and that must never stop a
  // feature (the viewer used to open empty): always use the bare origin, and carry on if the browser refuses anyway.
  const here = () => O + location.pathname + location.search;
  const setUrl = (kind, state, url) => { try { history[kind](state, "", url); } catch { /* the page works without a history entry */ } };
  if (location.username || location.password) setUrl("replaceState", null, here());

  const safeHref = (h) => (typeof h === "string" && h.startsWith("/") && !h.startsWith("//") ? h : "/");
  const dec = (s) => { try { return decodeURIComponent(s); } catch { return s; } };
  const size = (n) => { if (n == null) return ""; const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0, v = n; while (v >= 1024 && i < 4) { v /= 1024; i++; } return (i ? v.toFixed(v < 10 ? 1 : 0) : v) + " " + u[i]; };
  const when = (t) => (t ? new Date(t).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "");
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

  async function listDir(path) {
    const r = await fetch(abs(path), { method: "PROPFIND", headers: { Depth: "1" }, credentials: "same-origin" });
    if (r.status === 401) { location.reload(); return []; }
    if (!r.ok) throw new Error(r.status === 404 ? "This folder no longer exists." : "The server answered " + r.status + ".");
    const xml = new DOMParser().parseFromString(await r.text(), "application/xml");
    const self = dec(path).replace(/\/+$/, "");
    const items = [];
    for (const rs of xml.getElementsByTagNameNS("DAV:", "response")) {
      const g = (n) => rs.getElementsByTagNameNS("DAV:", n)[0]?.textContent ?? "";
      const href = safeHref(g("href"));
      const plain = dec(href).replace(/\/+$/, "");
      if (plain === self) continue;
      const dir = rs.getElementsByTagNameNS("DAV:", "collection").length > 0;
      const name = plain.split("/").pop() || plain;
      const len = g("getcontentlength");
      const m = Date.parse(g("getlastmodified"));
      items.push({ name, href: dir && !href.endsWith("/") ? href + "/" : href, dir, size: len === "" ? null : Number(len), mtime: Number.isNaN(m) ? 0 : m });
    }
    return items;
  }

  async function load(path, quiet = false) {
    st.path = path; st.error = "";
    if (!quiet) { st.loading = true; st.q = ""; st.selecting = false; st.sel.clear(); $("#q").value = ""; render(); }
    try { st.items = await listDir(path); } catch (e) { st.items = []; st.error = e && e.message ? e.message : "Couldn't load this folder."; }
    st.loading = false; st.sel = new Set([...st.sel].filter((h) => st.items.some((i) => i.href === h)));
    render(); void revealInTree(path);
  }

  function sorted() {
    const q = st.q.trim().toLowerCase();
    const k = st.sort, f = st.desc ? -1 : 1;
    return st.items.filter((i) => !q || i.name.toLowerCase().includes(q)).sort((a, b) => {
      if (a.dir !== b.dir) return a.dir ? -1 : 1;
      let c = 0;
      if (k === "size") c = (a.size ?? 0) - (b.size ?? 0);
      else if (k === "mtime") c = a.mtime - b.mtime;
      if (!c) c = a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" });
      return c * f;
    });
  }

  function crumbs() {
    const nav = $("#crumbs"); nav.replaceChildren();
    const home = el("a", "home", icon("folder") + "<span>Shared</span>"); home.href = abs("/"); home.dataset.go = "/";
    nav.append(home);
    const parts = st.path.split("/").filter(Boolean);
    let acc = "/";
    parts.forEach((p, i) => {
      acc += p + "/";
      nav.append(el("span", "sep", "/"));
      if (i === parts.length - 1) { const c = el("span", "cur"); c.textContent = dec(p); nav.append(c); }
      else { const a = el("a"); a.textContent = dec(p); a.href = abs(acc); a.dataset.go = acc; nav.append(a); }
    });
  }

  const TYPE = { image: "Image", video: "Video", audio: "Audio", pdf: "PDF document", archive: "Archive", text: "Text file" };
  const typeLabel = (it, kind) => (it.dir ? "Folder" : TYPE[kind] || (it.name.includes(".") ? it.name.split(".").pop().toUpperCase() + " file" : "File"));
  function render() {
    crumbs(); updateSelbar(); renderTree();
    document.title = (dec(st.path).replace(/\/+$/, "").split("/").pop() || "Shared") + " \u00b7 Notiq WebDAV";
    $("#vlist").setAttribute("aria-pressed", String(st.view === "list"));
    $("#vgrid").setAttribute("aria-pressed", String(st.view === "grid"));
    $("#sort").value = st.sort;
    const main = $("#main"), foot = $("#foot"); main.replaceChildren(); foot.textContent = "";
    if (st.loading) { const box = el("div", "list"); for (let i = 0; i < 7; i++) box.append(el("div", "skeleton")); main.append(box); return; }
    if (st.error) { const n = el("div", "note", icon("folder") + "<b>Couldn't open this folder</b>"); n.append(document.createTextNode(st.error)); const b = el("button", "btn", "Try again"); b.onclick = () => load(st.path); n.append(b); main.append(n); return; }
    shown = sorted();
    if (!shown.length) {
      const hint = st.q ? "Nothing in this folder matches your search." : canUpload ? "Drop files here, or use Upload." : "";
      main.append(el("div", "note", icon("folder") + (st.q ? "<b>No matches</b>" : "<b>This folder is empty</b>") + hint)); foot.textContent = "0 items"; return;
    }
    const wrap = el("div", (st.view === "grid" ? "grid" : "list") + (st.selecting ? " selecting" : ""));
    shown.forEach((it, i) => {
      const kind = kindOf(it), a = el("a", st.view === "grid" ? "card" : "row"); a.href = abs(it.href); a.dataset.i = String(i);
      const chk = el("span", "chk", CHECK); if (st.sel.has(it.href)) a.classList.add("sel");
      const name = document.createElement("div"); name.className = "name"; name.textContent = it.name; name.title = it.name;
      if (st.view === "grid") {

    const n = live.length, done = live.filter((j) => j.state === "done").length;
    $("#ups-fill").style.width = (total ? Math.round(loaded / total * 100) : 0) + "%";
    $("#ups-sub").textContent = busyUps() ? done + " of " + n + " \u00b7 " + size(loaded) + " of " + size(total) : "";
  }
  function renderUps() {
    const list = $("#uplist"), jobs = ups.jobs; list.replaceChildren();
    const busy = jobs.filter((j) => j.state === "queued" || j.state === "running").length, ok = jobs.filter((j) => j.state === "done").length, bad = jobs.filter((j) => j.state === "error").length, off = jobs.filter((j) => j.state === "cancelled").length;
    $("#upt").textContent = busy ? "Uploading " + busy + (busy === 1 ? " item" : " items") : bad ? ok + " uploaded, " + bad + " failed" : ok ? ok + (ok === 1 ? " upload" : " uploads") + " complete" : off ? "Upload cancelled" : "Uploads";
    $("#ups").classList.toggle("done", !busy && !bad && ok > 0); $("#ups").classList.toggle("bad", !busy && bad > 0);
    for (const j of jobs) {
      const row = el("div", "up " + (j.state === "error" ? "bad" : j.state === "cancelled" ? "off" : ""));
      const ic = el("div", "ui k-" + jobKind(j), icon(jobKind(j))), ut = el("div", "ut"), n = el("div", "upn"), m = el("div", "upm");
      n.textContent = j.rel ? j.name.split("/").pop() : j.name; n.title = j.name; m.textContent = j.msg; ut.append(n, m); j.mEl = m; j.fg = null;
      row.append(ic, ut);
      if (j.state === "running") {
        const b = iconBtn("", '<svg class="ring" viewBox="0 0 28 28"><circle class="bg" cx="14" cy="14" r="12"/><circle class="fg" cx="14" cy="14" r="12" stroke-dasharray="' + RING + '" stroke-dashoffset="' + RING + '"/></svg><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg>', "Cancel " + j.name, () => cancelJob(j));
        j.fg = b.querySelector(".fg"); row.append(b); paintJob(j);
      } else if (j.state === "queued") row.append(iconBtn("", '<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg>', "Cancel " + j.name, () => cancelJob(j)));
      else if (j.state === "done") row.append(iconBtn("okc", '<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>', "Uploaded"));
      else row.append(iconBtn("", '<svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>', "Try again", () => retryJob(j)));
      list.append(row);
    }
    paintTotal();
  }
  $("#upc").addEventListener("click", () => { $("#ups").classList.toggle("col"); $("#upc").title = $("#ups").classList.contains("col") ? "Expand" : "Collapse"; });
  $("#upx").addEventListener("click", async () => {
    if (busyUps()) { if (!(await askConfirm({ title: "Stop the uploads?", message: "Files still uploading will be cancelled. Files already uploaded stay.", confirm: "Stop uploads", danger: true }))) return; for (const j of [...ups.jobs]) cancelJob(j); }
    $("#ups").hidden = true; ups.jobs = [];
  });
  $("#ups").addEventListener("pointerenter", () => { ups.over = true; clearTimeout(ups.closeTimer); });
  $("#ups").addEventListener("pointerleave", () => { ups.over = false; if (!busyUps()) finishUps(); });
  window.addEventListener("beforeunload", (e) => { if (busyUps()) { e.preventDefault(); e.returnValue = ""; } });

  async function uploadFiles(list, destDir) {
    const files = [...list].filter((f) => f && f.name);
    if (!canUpload || !files.length) return;
    const dir = destDir || st.path, taken = new Set((dir === st.path ? st.items : await listDir(dir).catch(() => [])).map((i) => i.name));
    addJobs(files, dir, taken);
  }
  // Dropped folders: make the folders, then upload every file into its place (the top folder gets a free name).
  async function walk(entry, rel, out) {
    if (entry.isFile) { out.files.push({ file: await new Promise((ok, no) => entry.file(ok, no)), rel }); return; }
    out.dirs.push(rel);
    const reader = entry.createReader();
    for (;;) {
      const batch = await new Promise((ok, no) => reader.readEntries(ok, no));
      if (!batch.length) break;
      for (const c of batch) await walk(c, rel + "/" + c.name, out);
    }
  }
  async function uploadEntries(entries, destDir) {
    if (!canUpload) return;
    const dir = destDir || st.path, taken = new Set((dir === st.path ? st.items : await listDir(dir).catch(() => [])).map((i) => i.name)), out = { files: [], dirs: [] };
    try { for (const en of entries.filter(Boolean)) { const top = uniqueName(en.name, taken); taken.add(top); await walk(en, top, out); } }
    catch { say("Couldn't read the dropped folder.", true); return; }
    for (const d of out.dirs) await fetch(abs(dir + encRel(d) + "/"), { method: "MKCOL", credentials: "same-origin" }).catch(() => {});
    addJobs(out.files.map((x) => Object.assign(x.file, { __rel: x.rel })), dir, new Set());
  }
  $("#up").addEventListener("click", () => $("#file").click());
  $("#file").addEventListener("change", (e) => { void uploadFiles(e.target.files); e.target.value = ""; });
  $("#mk").addEventListener("click", async () => {
    const name = await askName({ title: "New folder", label: "Folder name", confirm: "Create" }); if (!name) return;
    const r = await fetch(abs(st.path + encodeURIComponent(name) + "/"), { method: "MKCOL", credentials: "same-origin" }).catch(() => null);
    if (r && r.status === 201) { say("Created " + name + "."); await load(st.path, true); } else say(r && r.status === 409 ? "A file or folder with that name already exists." : "Couldn't create the folder.", true);
  });

  // Drag files in from the computer: anywhere on the page uploads to the open folder, onto a folder (a row, a card, the
  // tree or a breadcrumb) uploads into that folder. Dropped folders keep their structure.
  let dragDepth = 0;
  const hasFiles = (e) => canUpload && !viewerOn && e.dataTransfer && [...e.dataTransfer.types].includes("Files");
  const fileTarget = (e) => (e.target.closest ? e.target.closest("#main [data-i], #crumbs [data-go], #tree [data-href]") : null);
  function fileDest(e) {
    const f = fileTarget(e); if (!f) return { dest: st.path, node: null };
    if (f.dataset.go) return { dest: f.dataset.go, node: f };
    if (f.dataset.href) return { dest: f.dataset.href, node: f };
    const it = shown[Number(f.dataset.i)]; return it && it.dir ? { dest: it.href, node: f } : { dest: st.path, node: null };
  }
  const folderLabel = (dest) => (dest === st.path ? folderName() : dec(dest).replace(/\/+$/, "").split("/").pop() || "Shared");
  window.addEventListener("dragenter", (e) => { if (hasFiles(e)) { dragDepth++; $("#drop").classList.add("on"); } });
  window.addEventListener("dragleave", (e) => { if (hasFiles(e) && --dragDepth <= 0) { dragDepth = 0; $("#drop").classList.remove("on"); clearDrop(); } });
  window.addEventListener("dragover", (e) => {
    if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = "copy";
    const { dest, node } = fileDest(e); clearDrop(); if (node) node.classList.add("dropto");
    $("#drop-t").textContent = "Drop to upload to \u201c" + folderLabel(dest) + "\u201d";
  });
  window.addEventListener("drop", (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault(); dragDepth = 0; $("#drop").classList.remove("on");
    const { dest } = fileDest(e); clearDrop();
    const entries = [...e.dataTransfer.items].filter((i) => i.kind === "file").map((i) => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null));
    if (entries.some((x) => x && x.isDirectory)) { void uploadEntries(entries, dest); return; }
    void uploadFiles([...e.dataTransfer.files], dest);
  });

  void detect();
  load(location.pathname);
})();
</script>
</body>
</html>
